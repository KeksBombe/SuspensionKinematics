name: Release

# Every push to main republishes the rolling "latest" release. The tag is moved
# rather than accumulated, so the download URLs never change and the releases
# page stays at one entry.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while the first is still building would race on deleting and
# recreating the same tag, so only one release run is ever in flight.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must track the Qt developers build against: 6.9 onwards exports
  # QT_USE_QSTRINGBUILDER from its CMake targets, and the XLSX reader
  # concatenates u"" literals, which only compiles with that operator+ present.
  #
  # Held at 6.9.x rather than the newest release: aqtinstall -- which is what
  # install-qt-action drives -- can no longer resolve 6.10+ from Qt's public
  # mirrors ("Failed to locate XML data for Qt version"), because those builds
  # moved behind the account-gated repository. Every run since this workflow
  # was written failed on exactly that. Raise this only after confirming
  # `aqt list-qt windows desktop --arch <version>` actually answers.
  QT_VERSION: 6.9.3
  # Open CASCADE 7.8 renamed the STEP libraries to TKDESTEP, which is what
  # CMakeLists.txt links against, so 7.9.x is the floor here as well.
  OCCT_TAG: V7_9_3

jobs:
  # ---------------------------------------------------------------------------
  # Windows: suspkin.exe, once as a portable zip and once as an installer.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read project version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v"                                  >> $env:GITHUB_OUTPUT
          "full=$v-build.${{ github.run_number }}"      >> $env:GITHUB_OUTPUT
          "fileversion=$v.${{ github.run_number }}"     >> $env:GITHUB_OUTPUT

      # The runner image tracks the current Visual Studio, so pinning a
      # generator ("Visual Studio 17 2022") breaks the moment the image moves on.
      # vswhere finds whatever is installed and vcvars64 puts its toolchain on
      # PATH, which keeps this job working across VS releases -- and lets both
      # builds below use Ninja instead of MSBuild.
      - name: Enter MSVC x64 environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          # Not $args -- that is an automatic variable in PowerShell.
          $query = @('-latest', '-products', '*',
                     '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64')
          $install = & $vswhere @query -property installationPath
          $display = & $vswhere @query -property catalog_productDisplayVersion
          if (-not $install) { throw "no Visual Studio with the x64 C++ toolset is installed" }
          Write-Host "Using Visual Studio $display at $install"

          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          # vcvars64 only mutates its own cmd session, so its resulting
          # environment is dumped and forwarded to the later steps. PATH goes
          # through GITHUB_PATH rather than GITHUB_ENV, which is what the runner
          # documents for path changes.
          $skip = '^(GITHUB_|RUNNER_|ACTIONS_|PROMPT$|_$)'
          cmd /c "call `"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([A-Za-z_][A-Za-z0-9_()]*)=(.*)$') {
              $name, $value = $matches[1], $matches[2]
              if ($name -match $skip) { return }
              if ($name -eq 'PATH') {
                $value | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
              } else {
                "$name=$value" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # OCCT is a ~30 minute build, so it is cached on its tag and the compiler.
      # Only the first run on a new tag pays for it.
      - name: Restore Open CASCADE
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/occt-install
          key: occt-${{ env.OCCT_TAG }}-windows-ninja-x64-v2

      - name: Build Open CASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OCCT_TAG https://github.com/Open-Cascade-SAS/OCCT.git occt-src
          # INSTALL_DIR_LAYOUT=Unix gives the plain bin/lib/include tree instead
          # of OCCT's win64/vc14 nesting, so OpenCASCADE_DIR below matches the
          # path the Linux presets already use.
          # Only the modules the STEP reader pulls in are built; Visualization
          # and Draw are the expensive ones and this project uses neither.
          cmake -S occt-src -B occt-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DINSTALL_DIR_LAYOUT=Unix `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/occt-install" `
            -DBUILD_LIBRARY_TYPE=Shared `
            -DBUILD_MODULE_Draw=OFF `
            -DBUILD_MODULE_Visualization=OFF `
            -DBUILD_DOC_Overview=OFF `
            -DUSE_FREETYPE=OFF `
            -DUSE_OPENGL=OFF `
            -DUSE_FREEIMAGE=OFF `
            -DUSE_VTK=OFF `
            -DUSE_TBB=OFF `
            -DUSE_FFMPEG=OFF
          cmake --build occt-build --parallel
          cmake --install occt-build

      # Saved here rather than left to actions/cache's post step, which is
      # skipped when the job fails -- a compile error in the app below would
      # otherwise discard the whole dependency build and rerun it next time.
      - name: Save Open CASCADE
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/occt-install
          key: occt-${{ env.OCCT_TAG }}-windows-ninja-x64-v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-ninja `
            -DSUSPKIN_BUILD_TESTS=OFF `
            -DSUSPKIN_BUILD_NUMBER=${{ github.run_number }} `
            -DOpenCASCADE_DIR="${{ github.workspace }}/occt-install/lib/cmake/opencascade"

      - name: Build
        run: cmake --build --preset windows-ninja

      # cmake --install runs windeployqt through the deploy script generated in
      # CMakeLists.txt, so dist/ ends up with the Qt runtime and plugins
      # beside the exe, all in one flat directory.
      - name: Stage install tree
        shell: pwsh
        run: |
          # The prefix must be absolute: Qt's deploy script passes it straight to
          # qt6_deploy_qt_conf, which rejects a relative path outright ("Given
          # qt.conf path is not an absolute path"). A bare `--prefix dist` fails.
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          cmake --install build/windows-ninja --prefix $dist
          # pwsh does not stop on a native command's exit code, and the steps
          # below would happily stage a half-deployed tree on top of a failure.
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed ($LASTEXITCODE)" }

          # windeployqt knows nothing about OCCT, so its DLLs are copied by hand.
          Copy-Item occt-install/bin/*.dll "$dist/" -Force
          # CMakeLists.txt installs the MSVC runtime DLLs app-local, so the
          # 25 MB redist installer windeployqt leaves behind is dead weight --
          # nothing runs it, and nothing needs it.
          Remove-Item "$dist/vc_redist.x64.exe" -Force -ErrorAction SilentlyContinue

          # The install lays the app out flat, so a stray bin/ means the layout
          # regressed and the packaging below would ship half a tree again.
          if (Test-Path "$dist/bin") { throw "unexpected bin/ in the install tree" }
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # dist/* not dist/bin/* -- the plugins live beside the exe, and taking
          # only part of the tree is what once shipped an app with no platform
          # plugin. Compress-Archive recurses into the directories it is given.
          Compress-Archive -Path dist/* `
            -DestinationPath "out/SuspensionKinematics-windows-x64.zip"

      # Verifies the artifact that actually ships, unpacked somewhere else --
      # not the build tree, which has Qt on PATH and the staging directory next
      # to it, and so cannot tell a complete package from an incomplete one.
      - name: Smoke test the packaged zip
        shell: pwsh
        run: |
          $tree = Join-Path $env:RUNNER_TEMP 'ziptest'
          Remove-Item $tree -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive out/SuspensionKinematics-windows-x64.zip -DestinationPath $tree

          # The hard gate. A missing platform plugin is the one failure that
          # looks like a healthy process -- Qt reports it in a modal dialog, so
          # the app sits there "running" -- and it is exactly what shipped when
          # packaging took bin/ alone. Checked structurally, in the zip.
          foreach ($f in 'suspkin.exe', 'qt.conf', 'plugins/platforms/qwindows.dll') {
            if (-not (Test-Path (Join-Path $tree $f))) {
              throw "packaged zip is missing $f"
            }
          }

          # Then actually run it, with PATH cut back to bare Windows from an
          # unrelated directory, so nothing outside the package can be reached.
          $si = New-Object System.Diagnostics.ProcessStartInfo
          $si.FileName = Join-Path $tree 'suspkin.exe'
          $si.UseShellExecute = $false
          $si.WorkingDirectory = 'C:\'
          $si.EnvironmentVariables['PATH'] = 'C:\Windows\system32;C:\Windows'
          $p = [System.Diagnostics.Process]::Start($si)

          $title = ''
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
            $p.Refresh()
            if ($p.MainWindowHandle -ne 0) { $title = $p.MainWindowTitle; break }
          }
          if ($p.HasExited) {
            throw ("suspkin.exe exited 0x{0:X8} -- the package is not self-contained" -f $p.ExitCode)
          }
          if ($title -and $title -notmatch 'SuspensionKinematics|New project') {
            # A Qt startup failure puts up a box titled after the exe.
            throw "suspkin.exe showed '$title' instead of its launcher"
          }
          if (-not $title) {
            # Runners are not always able to show a window; the structural
            # check above is what this step really rests on, so do not fail.
            Write-Host "note: no window appeared -- launcher check inconclusive"
          } else {
            Write-Host "launcher window: $title"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Package installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc `
            "/DAppVersion=${{ steps.ver.outputs.full }}" `
            "/DFileVersion=${{ steps.ver.outputs.fileversion }}" `
            "/DSourceDir=${{ github.workspace }}\dist" `
            "/DOutputDir=${{ github.workspace }}\out" `
            "/DOutputName=SuspensionKinematics-windows-x64-setup" `
            packaging\windows\suspkin.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Arch Linux: a real pacman package, built in an Arch container because the
  # GitHub runners are Ubuntu.
  # ---------------------------------------------------------------------------
  archlinux:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # Before checkout: actions/checkout shells out to git when it is present,
      # and the container image ships without it.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git cmake ninja qt6-base opencascade python sudo

      - uses: actions/checkout@v4

      - name: Read project version
        id: ver
        run: |
          v=$(grep -m1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$v"                             >> "$GITHUB_OUTPUT"
          echo "full=$v-build.${{ github.run_number }}"  >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          PKGVER: ${{ steps.ver.outputs.version }}
        run: |
          set -Eeuo pipefail
          # The checkout is owned by a different uid than the build user.
          git config --global --add safe.directory '*'

          # makepkg refuses to run as root, so the build happens as an
          # unprivileged user that can still call pacman for dependencies.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          # A PKGBUILD wants a source tarball, so the checkout becomes one
          # rather than the PKGBUILD reaching outside $srcdir.
          git archive --format=tar.gz \
            --prefix="suspensionkinematics-${PKGVER}/" \
            -o "packaging/arch/suspensionkinematics-${PKGVER}.tar.gz" HEAD

          chown -R builder:builder .
          # pkgver is templated so the PKGBUILD stays in step with CMakeLists.
          sudo -u builder env PKGVER="$PKGVER" bash -c '
            cd packaging/arch
            sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
            makepkg -sf --noconfirm
          '

      - name: Collect package
        run: |
          mkdir -p out
          cp packaging/arch/*.pkg.tar.zst out/
          # The pacman filename is fixed by makepkg, so the build number is
          # recorded alongside rather than baked into it.
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: archlinux
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Move the "latest" tag onto this commit and republish it with both downloads.
  # ---------------------------------------------------------------------------
  release:
    name: Publish rolling release
    needs: [windows, archlinux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # What the in-application updater reads. It is a plain asset rather than
      # the releases API: no token, no rate limit, and the rolling tag means
      # .../releases/latest/download/version.json is a URL that never changes.
      #
      # The digest is what makes the updater safe -- it downloads and executes
      # this installer, and will not run a file that does not hash to what is
      # published here.
      - name: Write the update manifest
        run: |
          set -Eeuo pipefail
          setup="SuspensionKinematics-windows-x64-setup.exe"
          test -f "artifacts/$setup" || { echo "no $setup to describe"; exit 1; }

          version=$(grep -m1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          sha=$(sha256sum "artifacts/$setup" | cut -d' ' -f1)
          size=$(stat -c%s "artifacts/$setup")
          base="${{ github.server_url }}/${{ github.repository }}/releases"

          cat > artifacts/version.json <<JSON
          {
            "version": "$version",
            "build": ${{ github.run_number }},
            "commit": "${GITHUB_SHA}",
            "releaseUrl": "$base/tag/latest",
            "windows": {
              "name": "$setup",
              "url": "$base/download/latest/$setup",
              "sha256": "$sha",
              "size": $size
            }
          }
          JSON
          cat artifacts/version.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          ls -l artifacts

          # Deleting the release with its tag is what makes this rolling; the
          # tag is then recreated on the commit being built. Ignore the failure
          # on the very first run, when there is nothing to delete yet.
          gh release delete latest --yes --cleanup-tag || true

          {
            echo "Automatic build of \`main\` at ${GITHUB_SHA}."
            echo
            echo "| Download | Platform | Notes |"
            echo "|---|---|---|"
            echo "| \`SuspensionKinematics-windows-x64-setup.exe\` | Windows 10/11 x64 | Installer. Qt and Open CASCADE are bundled. |"
            echo "| \`SuspensionKinematics-windows-x64.zip\` | Windows 10/11 x64 | Portable, same files without the installer. |"
            echo "| \`*.pkg.tar.zst\` | Arch Linux x86_64 | \`sudo pacman -U <file>\` |"
            echo
            echo "Built from $(git log -1 --pretty='%s')"
          } > notes.md

          gh release create latest \
            --title "Latest build (build.${{ github.run_number }})" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            artifacts/*
